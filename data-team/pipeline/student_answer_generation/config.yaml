# 가상 학생 답변 합성 데이터 파이프라인 설정

databases:
  # docker cp로 추출한 로컬 복사본
  student_platform: "sqlite:///./sp.db"
  contents_manager: "sqlite:///./cm.db"
  virtual_student: "sqlite:///./vs.db"

api:
  virtual_student_url: "http://localhost:8030"

# 중간 산출물 저장 경로
output_dir: "../../data/output"

simulation:
  max_students: 20                   # 한 번 실행 최대 학생 수
  max_questions_per_student: 50      # 학생 1인당 최대 문제 수
  question_types:
    - "MCQ"
    - "OX"
    - "short_answer"
  request_timeout: 120               # Virtual Student API 요청 타임아웃(초, 청크 단위)
  chunk_size: 10                     # 한 요청에 보낼 문제 수 (학생당 분할)
  concurrency: 5                     # 동시 처리할 요청 수

persona:
  mastery_to_knowledge_level: true   # avg(node_mastery) → prior_knowledge_level 매핑
  default_features:
    conceptual_depth: "보통"
    reasoning_style: "단계적"
    verbosity: "보통"
    confidence_level: "보통"
    learning_pace: "보통"
