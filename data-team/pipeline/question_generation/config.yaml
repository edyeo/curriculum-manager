# 문제 생성 파이프라인 설정

api:
  base_url: "http://localhost:8010"
  email: "admin@example.com"
  password: "admin1234"

# 강화 대상 선정: 노드별 published 문제 수 < min_questions 인 (node, question_type) 조합
min_questions: 3
question_types:
  - "MCQ"
  - "OX"
  - "short_answer"

# 생성 설정
generation:
  blueprint_id: null   # null → blueprint 없이 생성
  max_targets: 20      # 한 번 실행에서 처리할 최대 (node × type) 조합 수
  max_questions: 10    # 전체 생성 문제 수 상한 (null → 무제한)
  count_per_target: 3  # 조합당 생성 요청 문제 수
  poll_interval: 3     # job 완료 폴링 간격 (초)
  poll_timeout: 120    # job 완료 대기 최대 시간 (초)
