apiVersion: apps/v1
kind: Deployment
metadata:
  name: curriculum-manager
  namespace: curriculum
spec:
  replicas: 2
  selector:
    matchLabels:
      app: curriculum-manager
  template:
    metadata:
      labels:
        app: curriculum-manager
    spec:
      containers:
      - name: curriculum-manager
        image: curriculum/curriculum-manager:latest
        ports:
        - containerPort: 8001
        env:
        - name: DB_TYPE
          value: "postgres"
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: curriculum_db
        - name: DB_USER
          value: curriculum_user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: openai-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: curriculum-manager
  namespace: curriculum
spec:
  selector:
    app: curriculum-manager
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP
