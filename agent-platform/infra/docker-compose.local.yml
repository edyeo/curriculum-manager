version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: curriculum-postgres
    environment:
      POSTGRES_DB: curriculum_db
      POSTGRES_USER: curriculum_user
      POSTGRES_PASSWORD: curriculum_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schemas/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curriculum_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: curriculum-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Curriculum Manager Agent
  curriculum-manager:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        AGENT: curriculum-manager
    container_name: curriculum-manager
    environment:
      DB_TYPE: file
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: curriculum_db
      DB_USER: curriculum_user
      DB_PASSWORD: curriculum_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test-key}
      LOG_LEVEL: DEBUG
    ports:
      - "8001:8001"
    depends_on:
      - redis
    volumes:
      - ../agents/curriculum-manager:/app/agents/curriculum-manager
      - ../shared:/app/shared
      - ../../nodes.json:/app/nodes.json
      - ../../edges.json:/app/edges.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Mental Model Manager Agent
  mental-model-manager:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        AGENT: mental-model-manager
    container_name: mental-model-manager
    environment:
      AGENT: mental-model-manager
      PORT: 8002
      DB_TYPE: file
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: curriculum_db
      DB_USER: curriculum_user
      DB_PASSWORD: curriculum_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test-key}
      LOG_LEVEL: DEBUG
    ports:
      - "8002:8002"
    depends_on:
      - redis
    volumes:
      - ../agents/mental-model-manager:/app/agents/mental-model-manager
      - ../shared:/app/shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Researcher Agent
  researcher:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        AGENT: researcher
    container_name: researcher
    environment:
      AGENT: researcher
      PORT: 8003
      DB_TYPE: file
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: curriculum_db
      DB_USER: curriculum_user
      DB_PASSWORD: curriculum_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test-key}
      LOG_LEVEL: DEBUG
      NODES_FILE: /app/nodes.json
      RESEARCH_FILE: /app/research_results/research_results.json
    ports:
      - "8003:8003"
    depends_on:
      - redis
    volumes:
      - ../agents/researcher:/app/agents/researcher
      - ../shared:/app/shared
      - ../../nodes.json:/app/nodes.json
      - research_results:/app/research_results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Question Generator Agent
  question-generator:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        AGENT: question-generator
    container_name: question-generator
    environment:
      AGENT: question-generator
      PORT: 8004
      DB_TYPE: file
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: curriculum_db
      DB_USER: curriculum_user
      DB_PASSWORD: curriculum_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test-key}
      LOG_LEVEL: DEBUG
    ports:
      - "8004:8004"
    depends_on:
      - redis
    volumes:
      - ../agents/question-generator:/app/agents/question-generator
      - ../shared:/app/shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Grader Agent
  grader:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        AGENT: grader
    container_name: grader
    environment:
      AGENT: grader
      PORT: 8005
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      LOG_LEVEL: DEBUG
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # API Gateway
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        AGENT: gateway
    container_name: api-gateway
    environment:
      AGENT: gateway
      PORT: 9000
      CURRICULUM_MANAGER_URL: http://curriculum-manager:8001
      MENTAL_MODEL_MANAGER_URL: http://mental-model-manager:8002
      RESEARCHER_URL: http://researcher:8003
      QUESTION_GENERATOR_URL: http://question-generator:8004
      GRADER_URL: http://grader:8005
      LOG_LEVEL: DEBUG
    ports:
      - "9000:9000"
    depends_on:
      - curriculum-manager
      - mental-model-manager
      - researcher
      - question-generator
      - grader
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Contents Manager Backend
  contents-manager-backend:
    build:
      context: ../../contents-manager/backend
      dockerfile: Dockerfile
    container_name: contents-manager-backend
    environment:
      GATEWAY_URL: http://api-gateway:9000
      AGENT_DATA_DIR: /app/data
      CM_DB_PATH: /app/cm_db/contents_manager.db
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      KG_SERVICE_TOKEN: ${KG_SERVICE_TOKEN:-kg-service-secret}
    ports:
      - "8010:8010"
    depends_on:
      - gateway
    volumes:
      - ../../nodes.json:/app/data/nodes.json
      - ../../edges.json:/app/data/edges.json
      - cm_db:/app/cm_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Contents Manager Frontend
  contents-manager-frontend:
    build:
      context: ../../contents-manager/frontend
      dockerfile: Dockerfile
    container_name: contents-manager-frontend
    ports:
      - "3000:3000"
    depends_on:
      - contents-manager-backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Student Platform Backend
  student-platform-backend:
    build:
      context: ../../student-platform/backend
      dockerfile: Dockerfile
    container_name: student-platform-backend
    environment:
      KG_API_URL: http://contents-manager-backend:8010
      KG_SERVICE_TOKEN: ${KG_SERVICE_TOKEN:-kg-service-secret}
      GATEWAY_URL: http://api-gateway:9000
      STUDENT_JWT_SECRET: ${STUDENT_JWT_SECRET:-student-secret-change-in-prod}
      DATABASE_URL: sqlite:////app/db/student_platform.db
    ports:
      - "8020:8020"
    depends_on:
      - contents-manager-backend
      - gateway
    volumes:
      - student_db:/app/db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Student Platform Frontend
  student-platform-frontend:
    build:
      context: ../../student-platform/frontend
      dockerfile: Dockerfile
    container_name: student-platform-frontend
    environment:
      API_PROXY_TARGET: http://student-platform-backend:8020
    ports:
      - "3001:3001"
    depends_on:
      - student-platform-backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  student_db:
    driver: local
  research_results:
    driver: local
  cm_db:
    driver: local

networks:
  default:
    name: curriculum-network
    driver: bridge
