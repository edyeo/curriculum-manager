version: "1.0"
name: "engineering-curriculum"
description: "공학 커리큘럼 생성을 위한 지식 그래프 온톨로지"

# ── Entity 정의 ──────────────────────────────────────────────────
entities:
  Subject:
    description: |
      커리큘럼 도메인 단위. Seed, Concept, TechStack, System 노드들의 소속 범위를 정의.
      현재 SQLite에서 kg_nodes.subject_id (1:N FK)로 관리되며,
      Neo4j에서는 별도 노드로 표현하여 CONTAINS 관계로 연결.
    depth_range: null

  System:
    description: |
      실제로 구축·운영되는 소프트웨어 시스템 또는 플랫폼.
      여러 Seed(문제 공간)에 의존하며, 구체적인 기술 스택과 개념이 조합된 결과물.
    depth_range: [1, 3]

  Seed:
    description: |
      해결되지 않은 공학적 문제 공간.
      아직 완전히 풀리지 않았거나, 본질적으로 트레이드오프가 내재된 도전 과제.
    depth_range: [1, 3]
    constraints:
      anti_solution:
        enabled: true
        rule: |
          이름에 특정 기술적 해결책·패턴·메커니즘의 명칭을 포함하면 안 된다.
          (예: "Checkpointing", "Indexing", "Load Balancing" 금지)
        focus:
          - "딜레마: 두 가지 가치가 충돌하는 지점 (예: Throughput vs. Latency)"
          - "현상: 시스템이 실패할 때 무슨 일이 일어나는가 (예: State Divergence during Distributed Failures)"
        naming_patterns:
          - "{값1} vs. {값2} Tradeoff"
          - "{현상} under {조건}"
          - "{속성} {Collapse|Divergence|Amplification} in {컨텍스트}"

  Concept:
    description: |
      추상적 개념, 설계 원칙, 또는 아키텍처 패턴.
      특정 기술 구현이 아닌, 여러 구현에 걸쳐 적용될 수 있는 일반 원리.
      아키텍처 패턴인 경우 다수의 TechStack과 m:n으로 연결될 수 있다.
    depth_range: [1, 3]

  TechStack:
    description: |
      구체적인 기술, 도구, 또는 구현체.
      실제로 사용·배포 가능한 소프트웨어·프레임워크·라이브러리.
    depth_range: [2, 3]

# ── Relation 정의 ────────────────────────────────────────────────
relations:
  relied_on:
    description: "시스템 A는 문제 공간 B에 의존한다 (이 시스템이 다뤄야 할 핵심 문제)."
    valid_pairs:
      - [System, Seed]
    note: "System entity 전용. 현재 데이터에는 미반영."

  has_subtopic:
    description: "A는 B를 하위 주제로 포함한다 (동일 타입 내 부모→자식 계층)."
    valid_pairs:
      - [System, System]
      - [Seed, Seed]
      - [Concept, Concept]
      - [TechStack, TechStack]

  requires:
    description: "이 문제(Seed)를 이해하거나 다루려면 이 개념(Concept)이 필요하다."
    valid_pairs:
      - [Seed, Concept]
    note: "m:n 허용. 하나의 Seed가 여러 Concept을 요구할 수 있고, 하나의 Concept이 여러 Seed에 연결될 수 있다."

  implemented_by:
    description: "추상적 개념 A는 구체적 기술 B로 구현된다."
    valid_pairs:
      - [Concept, TechStack]
    note: "m:n 허용. 아키텍처 패턴 Concept의 경우 다수의 TechStack과 연결 가능."

  contains:
    description: "Subject A는 노드 B를 포함한다 (subject 소속 관계)."
    valid_pairs:
      - [Subject, Seed]
      - [Subject, Concept]
      - [Subject, TechStack]
      - [Subject, System]
    note: "Neo4j 전용. SQLite에서는 kg_nodes.subject_id FK로 표현."

  prerequisite:
    description: "A를 학습하기 전에 B를 먼저 알아야 한다 (선수지식)."
    valid_pairs: []
    note: "향후 정의 예정. 현재 미사용."
