[project]
name = "curriculum-manager"
version = "0.1.0"
description = "Pass-Iteration: 트리거 기반 지능형 커리큘럼 생성기 (PoC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.1",
    "langchain-core>=0.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
    "httpx>=0.24",
]
