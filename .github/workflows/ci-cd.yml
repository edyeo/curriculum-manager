name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'agents/**'
      - 'apps/**'
      - 'shared/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check agents/ apps/ shared/

      - name: Type check with mypy
        run: mypy agents/ apps/ shared/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --cov=agents --cov=shared --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push curriculum-manager image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            AGENT=curriculum-manager
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/curriculum-manager:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/curriculum-manager:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push mental-model-manager image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            AGENT=mental-model-manager
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mental-model-manager:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mental-model-manager:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push researcher image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            AGENT=researcher
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/researcher:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/researcher:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push question-generator image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            AGENT=question-generator
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/question-generator:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/question-generator:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name curriculum-manager-staging --region us-east-1

      - name: Deploy to staging
        run: |
          kubectl set image deployment/curriculum-manager curriculum-manager=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/curriculum-manager:${{ github.sha }} -n curriculum
          kubectl set image deployment/mental-model-manager mental-model-manager=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mental-model-manager:${{ github.sha }} -n curriculum
          kubectl set image deployment/researcher researcher=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/researcher:${{ github.sha }} -n curriculum
          kubectl set image deployment/question-generator question-generator=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/question-generator:${{ github.sha }} -n curriculum
          kubectl rollout status deployment -n curriculum --timeout=5m

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://api.curriculum-manager.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name curriculum-manager-production --region us-east-1

      - name: Deploy to production
        run: |
          kubectl set image deployment/curriculum-manager curriculum-manager=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/curriculum-manager:${{ github.sha }} -n curriculum
          kubectl set image deployment/mental-model-manager mental-model-manager=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mental-model-manager:${{ github.sha }} -n curriculum
          kubectl set image deployment/researcher researcher=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/researcher:${{ github.sha }} -n curriculum
          kubectl set image deployment/question-generator question-generator=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/question-generator:${{ github.sha }} -n curriculum
          kubectl rollout status deployment -n curriculum --timeout=10m

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
