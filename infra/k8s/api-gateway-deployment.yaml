apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: curriculum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: curriculum/api-gateway:latest
        ports:
        - containerPort: 9000
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: openai-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: curriculum
spec:
  selector:
    app: api-gateway
  ports:
  - port: 9000
    targetPort: 9000
  type: LoadBalancer
